apply plugin: 'com.android.application'

android {
    namespace = "mx.mexichat.app"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "mx.mexichat.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3
        versionName "1.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("KEYSTORE_PATH") ?: "${project.rootDir.absolutePath}/app/mexichat-release.keystore"
            def keystoreFile = file(keystorePath)

            if (!keystoreFile.exists()) {
                logger.error("❌ KEYSTORE NOT FOUND at: ${keystoreFile.absolutePath}")
                logger.error("Expected file: ${keystorePath}")
            } else {
                logger.info("✅ Keystore found at: ${keystoreFile.absolutePath}")
                storeFile keystoreFile
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: "MexiChat2026Rel"
                keyAlias System.getenv("KEY_ALIAS") ?: "mexichat"
                keyPassword System.getenv("KEY_PASSWORD") ?: "MexiChat2026Rel"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            debuggable true
        }
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/notice.txt'
        exclude 'META-INF/INDEX.LIST'
        exclude 'META-INF/*.kotlin_module'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')

    // Firebase Cloud Messaging (required for MexiChatMessagingService)
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

def servicesJSON = file('google-services.json')
if (servicesJSON.exists()) {
    try {
        apply plugin: 'com.google.gms.google-services'
    } catch (Exception e) {
        logger.warn("google-services plugin could not be applied: ${e.message}")
    }
} else {
    logger.info("google-services.json not found, google-services plugin not applied.")
}