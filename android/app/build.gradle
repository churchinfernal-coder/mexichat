apply plugin: 'com.android.application'

android {
    namespace = "mx.mexichat.app"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "mx.mexichat.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    signingConfigs {
        release {
            def props = new Properties()
            def propsFile = rootProject.file('local.properties')
            if (propsFile.exists()) {
                props.load(new FileInputStream(propsFile))
            }
            def storeFilePath = props['MEXICHAT_RELEASE_STORE_FILE']
            if (storeFilePath) {
                def keystoreFile = file(storeFilePath)
                if (keystoreFile.exists()) {
                    storeFile keystoreFile
                    storePassword props['MEXICHAT_RELEASE_STORE_PASSWORD']
                    keyAlias props['MEXICHAT_RELEASE_KEY_ALIAS']
                    keyPassword props['MEXICHAT_RELEASE_KEY_PASSWORD']
                } else {
                    logger.warn("WARNING: Keystore file not found at ${storeFilePath}.")
                }
            } else {
                logger.warn("WARNING: MEXICHAT_RELEASE_STORE_FILE not set in local.properties.")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            debuggable true
        }
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/notice.txt'
        exclude 'META-INF/INDEX.LIST'
        exclude 'META-INF/*.kotlin_module'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')

    // Firebase Cloud Messaging (required for MexiChatMessagingService)
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

def servicesJSON = file('google-services.json')
if (servicesJSON.exists()) {
    try {
        apply plugin: 'com.google.gms.google-services'
    } catch (Exception e) {
        logger.warn("google-services plugin could not be applied: ${e.message}")
    }
} else {
    logger.info("google-services.json not found, google-services plugin not applied.")
}